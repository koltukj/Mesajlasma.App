<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kozmik Sohbet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css?v=5.0">
</head>
<body>
    <!-- Giriş / Kayıt -->
    <div class="auth-container" id="authContainer" hidden>
        <div class="auth-box">
            <div class="auth-header">
                <div class="auth-icon-circle"><i class="bi bi-shield-lock-fill"></i></div>
                <h2 id="authTitle">Giriş Yap</h2>
                <p id="authSubtitle">Mesajlaşma ağına bağlanın</p>
            </div>

            <div class="auth-error" id="authError" hidden></div>

            <form id="authForm" novalidate>
                <div class="input-field" id="registerNameField" hidden>
                    <i class="bi bi-person-fill"></i>
                    <input type="text" id="authName" placeholder="Adınız Soyadınız" maxlength="50" autocomplete="name">
                </div>
                <div class="input-field">
                    <i class="bi bi-envelope-fill"></i>
                    <input type="email" id="authEmail" placeholder="E-posta adresi" required autocomplete="email">
                </div>
                <div class="input-field">
                    <i class="bi bi-lock-fill"></i>
                    <input type="password" id="authPassword" placeholder="Şifre (en az 8 karakter)" required autocomplete="current-password">
                </div>
                <button type="submit" class="auth-submit-btn" id="authSubmitBtn">Giriş Yap</button>
            </form>

            <div class="auth-footer">
                <span id="authSwitchPrompt">Hesabınız yok mu?</span>
                <a href="#" id="authSwitchLink">Kayıt Ol</a>
            </div>
        </div>
    </div>

    <!-- Ana Uygulama -->
    <div class="app-container" id="appContainer" hidden>
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="profile-meta">
                    <img id="currentUserAvatar" class="avatar" alt="Profil" title="Profil fotoğrafını değiştir">
                    <div class="profile-info">
                        <h3 id="currentUserName"></h3>
                        <span class="status-badge" id="currentUserStatus">
                            <span class="dot-online"></span> <span id="currentUserStatusText">Çevrimiçi</span>
                        </span>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="action-btn" id="profileEditButton" title="Profil ve ayarlar"><i class="bi bi-gear"></i></button>
                    <button class="action-btn" id="logoutButton" title="Çıkış yap"><i class="bi bi-box-arrow-right"></i></button>
                </div>
            </div>

            <div class="connection-banner" id="connectionBanner" hidden>
                <i class="bi bi-wifi-off"></i> Bağlantı koptu, yeniden bağlanılıyor...
            </div>

            <div class="search-box">
                <div class="search-wrapper">
                    <i class="bi bi-search"></i>
                    <input type="text" id="userSearchInput" placeholder="Sohbet ara veya isim/e-posta ile kişi bul...">
                    <button class="icon-clear-btn" id="clearUserSearchBtn" hidden title="Temizle"><i class="bi bi-x-lg"></i></button>
                </div>
            </div>

            <div class="user-list" id="conversationList"></div>
        </aside>

        <main class="chat-area">
            <header class="chat-header" id="chatHeader" hidden>
                <div class="active-partner-meta">
                    <button class="action-btn mobile-back-btn" id="mobileBackBtn" title="Geri"><i class="bi bi-arrow-left"></i></button>
                    <img id="partnerAvatar" class="avatar" alt="Profil">
                    <div class="partner-info">
                        <h2 id="partnerName"></h2>
                        <span id="partnerStatus" class="sub-text"></span>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="action-btn" id="chatSearchButton" title="Mesajlarda ara"><i class="bi bi-search"></i></button>
                </div>
            </header>

            <div class="chat-search-bar" id="chatSearchBar" hidden>
                <i class="bi bi-search"></i>
                <input type="text" id="chatSearchInput" placeholder="Bu sohbette ara (Enter)...">
                <button class="icon-clear-btn" id="chatSearchCloseBtn" title="Aramayı kapat"><i class="bi bi-x-lg"></i></button>
            </div>

            <section class="chat-messages" id="chatMessages">
                <div class="welcome-placeholder" id="welcomePlaceholder">
                    <div class="icon-circle"><i class="bi bi-chat-left-text-fill"></i></div>
                    <h2>Sohbet Odasına Hoş Geldiniz</h2>
                    <p>Sol panelden bir sohbet seçin veya arama kutusuna isim ya da e-posta yazarak yeni bir kişi bulun.</p>
                </div>
            </section>

            <!-- Ek dosya / düzenleme önizleme çubuğu -->
            <div class="composer-bar" id="composerBar" hidden>
                <div class="composer-bar-text" id="composerBarText"></div>
                <button class="icon-clear-btn" id="composerBarCancel" title="İptal"><i class="bi bi-x-lg"></i></button>
            </div>

            <footer class="chat-input-container" id="chatInputContainer" hidden>
                <button class="input-action-btn" id="attachButton" title="Dosya veya fotoğraf ekle"><i class="bi bi-paperclip"></i></button>
                <input type="file" id="fileInput" hidden accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.doc,.docx,.xls,.xlsx,.txt">

                <div class="emoji-Anchor">
                    <button class="input-action-btn" id="emojiButton" title="Emoji ekle"><i class="bi bi-emoji-smile"></i></button>
                    <div class="emoji-popover" id="emojiPopover" hidden></div>
                </div>

                <div class="input-wrapper">
                    <textarea id="messageInput" rows="1" maxlength="4000" placeholder="Bir mesaj yazın... (Enter gönderir, Shift+Enter alt satır)"></textarea>
                </div>
                <button id="sendButton" class="send-btn" title="Gönder"><i class="bi bi-send-fill"></i></button>
            </footer>
        </main>
    </div>

    <!-- Profil ve Ayarlar Penceresi -->
    <div class="modal-backdrop" id="profileModal" hidden>
        <div class="modal-card">
            <div class="modal-header">
                <h3>Profil ve Ayarlar</h3>
                <button class="icon-clear-btn" id="closeProfileModal"><i class="bi bi-x-lg"></i></button>
            </div>

            <div class="profile-avatar-row">
                <img id="modalAvatar" class="avatar avatar-lg" alt="Profil">
                <div class="profile-avatar-actions">
                    <button type="button" class="secondary-btn" id="changeAvatarBtn"><i class="bi bi-camera"></i> Fotoğraf Yükle</button>
                    <button type="button" class="secondary-btn danger-btn" id="removeAvatarBtn"><i class="bi bi-trash3"></i> Kaldır</button>
                    <input type="file" id="profilePhotoInput" hidden accept=".jpg,.jpeg,.png,.gif,.webp">
                </div>
            </div>

            <form id="profileForm">
                <label class="field-label">Görünen Ad</label>
                <div class="input-field"><input type="text" id="profileNameInput" required maxlength="50"></div>

                <label class="field-label">Durum Mesajı</label>
                <div class="input-field"><input type="text" id="profileStatusInput" maxlength="140" placeholder="Müsait, meşgul..."></div>

                <label class="checkbox-row">
                    <input type="checkbox" id="profileInvisibleInput">
                    <span>Görünmez mod (çevrimiçi ve son görülme gizlenir)</span>
                </label>

                <button type="submit" class="auth-submit-btn">Profili Kaydet</button>
            </form>

            <hr class="modal-divider">

            <form id="passwordForm">
                <h4>Şifre Değiştir</h4>
                <div class="input-field"><input type="password" id="currentPasswordInput" placeholder="Mevcut şifre" required autocomplete="current-password"></div>
                <div class="input-field"><input type="password" id="newPasswordInput" placeholder="Yeni şifre (en az 8 karakter)" required autocomplete="new-password"></div>
                <button type="submit" class="secondary-btn full-btn">Şifreyi Güncelle</button>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="lib/signalr/signalr.min.js"></script>
    <script src="app.js?v=5.0"></script>
</body>
</html>
